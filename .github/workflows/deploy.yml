name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys overlap.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT }} # optional; defaults to 22
          username: freemap
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Without this the script runs on after a failing command, so a
          # deploy that never updated the code still reports success.
          script_stop: true
          script: |
            cd /home/freemap/freemap-v3-nodejs-backend
            # `git pull --ff-only` refuses once the server's branch has diverged
            # from main (a rebase or force-push upstream is enough), and it did
            # so silently for several deploys: the service kept restarting on an
            # old commit. The server is a mirror of main, never a place to
            # commit, so overwrite it instead of merging. Untracked files are
            # left alone.
            git fetch origin main
            git reset --hard origin/main
            bash scripts/remote-deploy.sh
