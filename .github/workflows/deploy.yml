name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys overlap.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Nothing else runs the tests before production: fm6 only installs, builds
  # and restarts. A dependency bump (gdal-async 3.13 flipped the elevation axis
  # order) would otherwise reach users first.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      # The pnpm fm6 deploys with. Not pnpm/action-setup: see harvest.yml.
      - run: npm install -g pnpm@11.9.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  deploy:
    needs: test
    # A manual run on another branch tests it without deploying (the server
    # deploys main regardless of the branch the run came from).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT }} # optional; defaults to 22
          username: freemap
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Without this the script runs on after a failing command, so a
            # deploy that never updated the code still reports success.
            # (`script_stop:` did this until appleboy/ssh-action v1.1.0 dropped
            # the input; the moving `@v1` tag then silently ignored it.)
            set -e
            cd /home/freemap/freemap-v3-nodejs-backend
            # `git pull --ff-only` refuses once the server's branch has diverged
            # from main (a rebase or force-push upstream is enough), and it did
            # so silently for several deploys: the service kept restarting on an
            # old commit. The server is a mirror of main, never a place to
            # commit, so overwrite it instead of merging. Untracked files are
            # left alone.
            git fetch origin main
            git reset --hard origin/main
            bash scripts/remote-deploy.sh
